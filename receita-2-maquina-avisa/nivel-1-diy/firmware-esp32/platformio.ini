; PlatformIO project for the ESP32 + ADXL345 vibration sensor node.
;
; PT: Lê o ADXL345 a 1 kHz, captura 1 segundo de amostras (3 eixos),
; envia por MQTT como payload JSON.
; EN: Reads the ADXL345 at 1 kHz, captures 1 second of samples (3 axes),
; ships over MQTT as a JSON payload.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.9
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.1
    adafruit/Adafruit ADXL345 @ ^1.3
    adafruit/Adafruit Unified Sensor @ ^1.1

; Configure secrets via secrets.ini (gitignored) — see secrets.ini.example
; for the required defines.
